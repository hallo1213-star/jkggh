<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02070d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <title>J.A.R.V.I.S. – Anmelden</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <div class="grid-bg" aria-hidden="true"></div>
  <main class="login-card">
    <span class="login-mark" aria-hidden="true"></span>
    <h1>J.A.R.V.I.S.</h1>
    <p class="login-sub">Identität bestätigen</p>
    <form id="login-form" autocomplete="on">
      <input type="text" name="username" value="jarvis" autocomplete="username" hidden>
      <label for="password">Passwort</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <p class="login-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary" type="submit" id="login-submit">Anmelden</button>
    </form>
  </main>
  <script src="/login.js" type="module"></script>
</body>
</html>
