services:
  - type: web
    name: jarvis
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TZ
        value: Europe/Berlin
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: JARVIS_PASSWORD
        sync: false
      - key: USER_NAME
        sync: false
      - key: LAPTOP_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
