services:
  - type: web
    name: jarvis
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TZ
        value: Europe/Berlin
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: JARVIS_PASSWORD
        sync: false
      - key: LAPTOP_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
        sync: false
      - key: GUMROAD_ACCESS_TOKEN
        sync: false
      - key: WINDY_WEBCAMS_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_VIDEO_MODEL
        sync: false
      - key: REPLICATE_VIDEO_PRICE
        sync: false
      - key: CESIUM_ION_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: VERKAEUFER_NAME
        sync: false
      - key: VERKAEUFER_ADRESSE
        sync: false
      - key: VERKAEUFER_EMAIL
        sync: false
      - key: BAUPLAN_LINK_STARTER
        sync: false
      - key: BAUPLAN_LINK_KOMPLETT
        sync: false
