<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DU BIST DRAN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:22px 7%;border-bottom:1px solid #293047;font-size:24px;font-weight:bold}
header span{color:#8b7cff}
main{max-width:850px;margin:70px auto;padding:20px}
h1{font-size:46px;margin-bottom:12px}
p{color:#b9c0d4;line-height:1.6}
textarea{width:100%;height:140px;padding:16px;border:1px solid #414b69;border-radius:12px;background:#151c31;color:white;font-size:16px}
button{padding:14px 20px;background:#7867ff;color:white;border:0;border-radius:10px;font-size:16px;cursor:pointer;margin-top:12px}
#result{margin-top:24px;padding:20px;border:1px solid #414b69;border-radius:12px;white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<header>DU <span>BIST DRAN</span></header>
<main>
<h1>Deine Idee. Deine KI.</h1>
<p>Beschreibe, was du erstellen möchtest. Wir verwandeln deine Idee in ein Projekt.</p>
<textarea id="idea" placeholder="Erstelle mir eine Website, auf der ich meine Sachen verkaufen kann ..."></textarea>
<br>
<button onclick="start()">Projekt starten →</button>
<div id="result">Dein Projekt erscheint hier.</div>
</main>
<script>
function start(){
const idea=document.getElementById('idea').value.trim();
const result=document.getElementById('result');
if(!idea){result.textContent='Bitte beschreibe zuerst deine Idee.';return;}
result.textContent='Deine Idee:\n'+idea+'\n\nAls Nächstes verbinden wir DU BIST DRAN mit einer KI, die echten Code schreiben und deine Projekte verändern kann.';
}
</script>
</body>
</html>
